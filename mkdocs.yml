site_name: KSR Full Stack Training
site_description: Full Stack Java & Python training material for beginners and career switchers
site_url: https://kyedumati.github.io/KSR-FULLSTACK-MATERIAL/
repo_url: https://github.com/kyedumati/KSR-FULLSTACK-MATERIAL
repo_name: KSR-FULLSTACK-MATERIAL
edit_uri: ""
copyright: Copyright &copy; 2026 KSR Trainings

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    logo: material/school
  features:
    - announce.dismiss
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
    - toc.integrate

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kyedumati/KSR-FULLSTACK-MATERIAL
      name: Source on GitHub

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/ksr.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - abbr
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - How to Use This Material: getting-started/how-to-use.md
      - Lesson Template: getting-started/lesson-template.md
  - Roadmaps:
      - roadmaps/index.md
      - Full Stack Java: roadmaps/java-track.md
      - Full Stack Python: roadmaps/python-track.md
  - Frontend: frontend/index.md
  - Java: java/index.md
  - Python:
      - python/index.md
      - Python Foundation:
          - python/foundation/index.md
          - Introduction to Python: python/foundation/01-introduction-to-python.md
          - Variables in Python: python/foundation/02-variables.md
          - Data Types in Python: python/foundation/03-data-types.md
          - Operators in Python: python/foundation/04-operators.md
          - Input, Output & Type Conversion: python/foundation/05-input-output-type-conversion.md
          - Strings in Python: python/foundation/06-strings.md
          - Conditional Statements: python/foundation/07-conditional-statements.md
          - Loops in Python: python/foundation/08-loops.md
          - Lists in Python: python/foundation/09-lists.md
          - Tuples in Python: python/foundation/10-tuples.md
          - Sets in Python: python/foundation/11-sets.md
          - Dictionaries in Python: python/foundation/12-dictionaries.md
  - Database: database/index.md
  - Generative AI: genai/index.md
  - Projects: projects/index.md
  - Interview Prep: interview/index.md
