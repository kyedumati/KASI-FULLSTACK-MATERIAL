          - CRUD Operations: database/mysql/04-crud-operations.md
          - Filtering, Sorting & Pagination: database/mysql/05-filtering-sorting.md
          - Aggregations & GROUP BY: database/mysql/06-aggregations-group-by.md
          - Functions & Expressions: database/mysql/07-functions-expressions.md
          - Database Design: database/mysql/08-database-design.md
          - Joins: database/mysql/09-joins.md
          - Subqueries, Views & CTEs: database/mysql/10-subqueries-views-ctes.md
          - Window Functions: database/mysql/11-window-functions.md
